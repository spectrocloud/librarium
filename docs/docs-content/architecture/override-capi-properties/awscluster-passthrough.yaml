# AWSCluster RFC 7396 JSON Merge Patch Template
# API Version: infrastructure.cluster.x-k8s.io/v1beta2
# CAPA Release: v2.7.1
#
# Usage: populate only the fields you wish to inject/override.
# Keys set to null will DELETE that field from the target object (RFC 7396 semantics).
# Omit keys you do not want to touch.

apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: AWSCluster
metadata:
  name: <cluster-name>
  namespace: <namespace>
  # Optional: extra labels / annotations merged onto the object
  labels: {}
  annotations: {}

spec:

  # ── Identity ──────────────────────────────────────────────────────────────
  # Reference to the AWS identity used by the CAPA controller for this cluster.
  # Kind must be one of: AWSClusterControllerIdentity | AWSClusterRoleIdentity | AWSClusterStaticIdentity
  identityRef:
    name: default                          # name of the identity object
    kind: AWSClusterControllerIdentity     # enum (see above)

  # ── Region / Partition ────────────────────────────────────────────────────
  region: eu-west-1          # AWS region (required)
  partition: aws             # AWS partition: aws | aws-cn | aws-us-gov (default: aws)

  # ── SSH Key ───────────────────────────────────────────────────────────────
  # Set to "" to attach no SSH key; omit field to use controller default.
  sshKeyName: ""

  # ── Control-plane endpoint ────────────────────────────────────────────────
  # Typically managed by CAPA; override only when using a pre-existing LB or DNS.
  controlPlaneEndpoint:
    host: ""          # DNS name or IP of the API server endpoint
    port: 6443        # TCP port (default 6443)

  # ── Additional Tags ───────────────────────────────────────────────────────
  # Merged on top of every AWS resource the controller creates.
  additionalTags:
    Environment: production
    Team: platform
    # <key>: <value>

  # ── AMI Lookup ────────────────────────────────────────────────────────────
  # Applies to all machines that do not specify their own AMI.
  imageLookupFormat: "capa-ami-{{.BaseOS}}-?{{.K8sVersion}}-*"   # go-template
  imageLookupOrg: ""          # AWS Organisation ID owning the AMIs
  imageLookupBaseOS: ubuntu   # base OS name inserted into imageLookupFormat

  # ── Network ───────────────────────────────────────────────────────────────
  network:

    # VPC configuration
    vpc:
      id: ""                          # Pre-existing VPC ID (unmanaged VPC)
      cidrBlock: "10.0.0.0/16"        # CIDR for a managed (new) VPC
      ipv6:                           # IPv6 dual-stack (optional)
        cidrBlock: ""
        poolId: ""
        egressOnlyInternetGatewayId: ""
      internetGatewayId: ""           # Pre-existing IGW (unmanaged)
      tags: {}                        # Extra tags on the VPC resource
      availabilityZoneUsageLimit: 3   # Max AZs to use (0 = unlimited)
      availabilityZoneSelection: Ordered  # Ordered | Random
      emptyRoutesDefaultVPCSecurityGroup: false  # Remove default SG rules

    # Subnets
    # When providing existing subnets (unmanaged VPC), specify the subnet IDs.
    # When letting CAPA create subnets, specify cidrBlock + az + isPublic.
    subnets:
      - id: ""                        # Pre-existing subnet ID (unmanaged)
        cidrBlock: "10.0.0.0/24"
        availabilityZone: eu-west-1a
        isPublic: false
        routeTableId: ""              # Optional: bind to a specific route table
        natGatewayId: ""              # Optional: specify NAT gateway
        tags: {}
      - id: ""
        cidrBlock: "10.0.1.0/24"
        availabilityZone: eu-west-1b
        isPublic: false
        tags: {}
      - id: ""
        cidrBlock: "10.0.128.0/24"
        availabilityZone: eu-west-1a
        isPublic: true
        tags: {}
      - id: ""
        cidrBlock: "10.0.129.0/24"
        availabilityZone: eu-west-1b
        isPublic: true
        tags: {}

    # CNI configuration
    cni:
      cniIngressRules:
        - description: "BGP (calico)"
          protocol: tcp
          fromPort: 179
          toPort: 179
        - description: "IP-in-IP (calico)"
          protocol: "4"
          fromPort: -1
          toPort: 65535

    # Security Group overrides — use pre-existing SG IDs instead of CAPA-managed ones.
    # Keys: bastion | controlplane | apiserver-lb | node | lb | node-eks-additional
    securityGroupOverrides:
      bastion: ""
      controlplane: ""
      apiserver-lb: ""
      node: ""
      lb: ""

  # ── Control-Plane Load Balancer ───────────────────────────────────────────
  controlPlaneLoadBalancer:
    # Name is immutable once set; max 32 alphanumeric/hyphen chars (classic ELB only)
    name: ""

    # Scheme: internet-facing | internal  (default: internet-facing)
    scheme: internet-facing

    # Type: classic | elb | alb | nlb | disabled  (default: classic)
    loadBalancerType: classic

    crossZoneLoadBalancing: false

    # Subnets to attach the LB to (defaults to discovered subnets)
    subnets: []

    # Additional security groups (SG IDs) attached to the LB
    additionalSecurityGroups: []

    # Health check protocol: TCP | SSL | HTTP | HTTPS | TLS | UDP
    healthCheckProtocol: SSL

    # Fine-grained health check for the API target group (NLB / ALB)
    healthCheck:
      protocol: ""         # TCP | HTTP | HTTPS
      port: ""             # "traffic-port" or a numeric string
      path: ""             # HTTP/HTTPS only
      intervalSeconds: 10
      timeoutSeconds: 10
      thresholdCount: 3
      unhealthyThresholdCount: 3

    # Additional listeners (NLB only)
    # +listType=map  +listMapKey=port
    additionalListeners:
      - port: 9345            # RKE2 supervisor port example
        protocol: TCP
        healthCheck:
          protocol: TCP
          port: "9345"
          intervalSeconds: 10
          thresholdCount: 3
          unhealthyThresholdCount: 3

    # Custom ingress rules on the LB security group
    ingressRules:
      - description: "Kubernetes API"
        protocol: tcp
        fromPort: 6443
        toPort: 6443
        cidrBlocks:
          - "0.0.0.0/0"
        ipv6CidrBlocks:
          - "::/0"

    # NLB-specific options
    disableHostsRewrite: false
    preserveClientIP: false

  # ── Secondary Control-Plane Load Balancer ─────────────────────────────────
  # Optional second LB — e.g. an internal NLB alongside a public classic ELB.
  secondaryControlPlaneLoadBalancer:
    name: ""
    scheme: internal
    loadBalancerType: nlb
    crossZoneLoadBalancing: false
    subnets: []
    additionalSecurityGroups: []
    healthCheckProtocol: TCP
    healthCheck: {}
    additionalListeners: []
    ingressRules: []
    disableHostsRewrite: false
    preserveClientIP: false

  # ── Bastion Host ──────────────────────────────────────────────────────────
  bastion:
    enabled: false
    disableIngressRules: false
    # CIDR blocks allowed SSH access to the bastion (default: 0.0.0.0/0)
    allowedCIDRBlocks:
      - "10.0.0.0/8"
    # Instance type (default: t3.micro, t2.micro in us-east-1)
    instanceType: t3.micro
    # AMI override; leave empty to use the public default
    ami: ""

  # ── S3 Bucket (Ignition bootstrap) ───────────────────────────────────────
  # Required only when using Ignition bootstrap (BootstrapFormatIgnition feature flag).
  s3Bucket:
    # Bucket name: 3–63 chars, lowercase alphanumeric / hyphens / dots
    name: ""
    controlPlaneIAMInstanceProfile: ""
    nodesIAMInstanceProfiles:
      - ""
    # Duration for presigned URLs, e.g. "1h" — when set, IAM instance profiles are NOT used
    presignedURLDuration: ""
    bestEffortDeleteObjects: false