StylesPath = vale/styles

Vocab = spectrocloud-vocab

MinAlertLevel = suggestion

Packages = Google, write-good, alex, https://github.com/spectrocloud/spectro-vale-pkg/releases/latest/download/spectrocloud-docs-internal.zip
IgnoredScopes = code, tt, img, url, a,
[*.md]
BasedOnStyles = Vale, Google, write-good, alex, spectrocloud-docs-internal

; BlockIgnores = 

; The following line ignores all import statements in markdown files, backticks
TokenIgnores = (?s) *(import).*?(;),\*\*.*?\*\*, (\x60[^\n\x60]+\x60),

[formats]
mdx = md
[*]
Google.Headings = NO
Google.Parens = NO
Google.Spacing = NO
Google.We = NO
Google.Acronyms = NO
Alex.Condescending = NO
Google.OptionalPlurals = NO
; A glossary legitimately uses single-letter section dividers (## A, ## B ...) and
; term-name headings that Vale's general heading rules flag. Scope those off here.
; The same exception applies to the frozen copy in every cut version.
[docs/products/paletteai-inference-launchpad/reference/glossary.md]
spectrocloud-docs-internal.heading-all-caps = NO
spectrocloud-docs-internal.headings-title = NO

[*_versioned_docs/**/reference/glossary.md]
spectrocloud-docs-internal.heading-all-caps = NO
spectrocloud-docs-internal.headings-title = NO

; Frozen product-doc archives are shipped output. A Vale rule change should not
; retroactively fail an archived version's build, so no styles run there. An
; empty value is required: `BasedOnStyles = NO` treats "NO" as a style name and
; dies with `style 'NO' does not exist on StylesPath`.
[*_versioned_docs/**]
BasedOnStyles =

; PaletteAI Inference Launchpad documents LLM parameter counts as `9B`, `3.5B`,
; and so on. Google.Units reads that as "9 Bytes" and asks for a nonbreaking
; space; a literal space would turn a model name into a byte count.
[docs/products/paletteai-inference-launchpad/**/*.md]
Google.Units = NO
