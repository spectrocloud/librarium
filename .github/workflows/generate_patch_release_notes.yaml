
name: "Generate Patch Release Notes"

on:
  workflow_dispatch:
    inputs:
      jira_ticket:
        description: "Jira ticket for the patch release, for example DOC-2815."
        required: true
      base_branch:
        description: "Base branch for the pull request."
        required: true
        default: "master"
      patch_version:
        description: "Palette patch release version, for example 4.9.48. Use a placeholder such as 4.9.x while it is undecided. Empty takes the version from the candidates JQL."
        required: false
      component_updates:
        description: "Tick when this patch adds a new CanvOS or Palette CLI version, or both. Leave clear to generate the release notes body only, in which case the two fields below are ignored."
        required: false
        type: boolean
        default: false
      nickfury_ref:
        description: "nickfury branch or tag holding those versions, for example release-4.9 or v4.9.47-rc.2. Empty records the versions as PENDING."
        required: false
      palette_cli_sha:
        description: "Palette CLI SHA256 checksum, from ReTool. Enter derive to read it from the published binary. Empty records it as PENDING."
        required: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
  SUPER_API_TOKEN: ${{ secrets.SUPER_API_TOKEN }}
  NODE_VERSION: "24"
  JIRA_TICKET: ${{ github.event.inputs.jira_ticket }}
  BASE_BRANCH: ${{ github.event.inputs.base_branch }}
  ALGOLIA_APP_ID: "123456789"
  ALGOLIA_INDEX_NAME: "123456789"
  ALGOLIA_SEARCH_KEY: "123456789"

jobs:
  generate_release_notes:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Retrieve Credentials
        id: import-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.prism.spectrocloud.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: /providers/github/organizations/spectrocloud/token?org_name=spectrocloud token | VAULT_GITHUB_TOKEN

      - name: Checkout Librarium Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          repository: spectrocloud/librarium
          ref: ${{ env.BASE_BRANCH }}
          token: ${{ steps.import-secrets.outputs.VAULT_GITHUB_TOKEN }}
  
      - name: Set Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm" 

      - run: |
          npm ci
      
      - name: Execute Script to Generate Patch Release Notes
        env:
          # The default GITHUB_TOKEN is scoped to this repository and cannot read the private
          # nickfury repository that holds the component versions, so use the Vault token here.
          GITHUB_TOKEN: ${{ steps.import-secrets.outputs.VAULT_GITHUB_TOKEN }}
          PATCH_RELEASE_VERSION: ${{ github.event.inputs.patch_version }}
          NICKFURY_REF: ${{ github.event.inputs.nickfury_ref }}
          PATCH_PALETTE_CLI_SHA: ${{ github.event.inputs.palette_cli_sha }}
          PATCH_COMPONENT_UPDATES: ${{ github.event.inputs.component_updates }}
        run: |
          touch .env
          PATCH_RELEASE_TICKET="${{ env.JIRA_TICKET }}" make generate-patch-release-notes

      - name: Create a PR with generated patch release notes
        env:
          GH_TOKEN: ${{ steps.import-secrets.outputs.VAULT_GITHUB_TOKEN }}
        run: |
          # Create a new branch
          branch_name="${{ env.JIRA_TICKET }}-generate-patch-notes-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$branch_name"

          # Commit and push the changes. A patch that bumps the CanvOS or Palette CLI version also
          # updates the Edge Compatibility Matrix, the CLI Tools table, and the Palette CLI install
          # page, so stage all four pages rather than only the release notes.
          git add docs/docs-content/release-notes/release-notes.md \
            docs/docs-content/clusters/edge/edge-compatibility-matrix.md \
            docs/docs-content/downloads/cli-tools.md \
            docs/docs-content/automation/palette-cli/install-palette-cli.md
          git commit -m "docs: add patch release notes for ${{ env.JIRA_TICKET }}"
          git push origin $branch_name

          # Create the pull request
          pr_body='
          ## Describe the Change
          This PR adds the patch release notes for the Jira ticket `${{ env.JIRA_TICKET }}` to the `release-notes.md` file.'
          output=$(gh pr create --base "${{ env.BASE_BRANCH }}" --title "docs: add patch release notes for ${{ env.JIRA_TICKET }}" --body "$pr_body")
          pr_url=$(echo "$output" | grep -o "https://[^ ]*")
          echo "PR successfully created $pr_url."

          # Save the PR URL as an environment variable
          echo "GITHUB_PATCH_RELEASE_NOTES_PR=$pr_url" >> $GITHUB_ENV

      - name: Success Slack Notification
        if: ${{ env.GITHUB_PATCH_RELEASE_NOTES_PR  != ''}}
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_PRIVATE_TEAM_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACKIFY_MARKDOWN: true
          ENABLE_ESCAPES: true
          SLACK_MESSAGE: 'A new PR with patch release notes was created for Jira ticket `${{ env.JIRA_TICKET }}`. Please review ${{env.GITHUB_PATCH_RELEASE_NOTES_PR}} for more details.'

      - name: Failure Slack Notification
        if: ${{ failure() }}
        uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_PRIVATE_TEAM_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACKIFY_MARKDOWN: true
          ENABLE_ESCAPES: true
          SLACK_MESSAGE: 'The generate patch release notes job for Jira ticket `${{ env.JIRA_TICKET }}` in `${{ github.repository }}` failed. [View details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).'
          
