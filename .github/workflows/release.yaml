# This workflow pushes updates to the production site at docs.spectrocloud.com. 
# The workflow is triggered by a cron job that runs at 12:00 PM PST (8 PM UTC) Monday through Friday, 9:00 PM PST (5 AM UTC next day) Monday through Friday, 12:00 PM PST (8 PM UTC next day) Saturday, and 12:00 PM PST (8 PM UTC next day) Sunday.
# The workflow uses the self-hosted runner by default. The GitHub-hosted large runner can be used by setting the useGitHubHostedLargeRunner input to true.
# If the self-hosted runner does not pick up the build within PICKUP_TIMEOUT_MINUTES, the self-hosted-runner-watchdog job posts to Slack and dispatches this workflow again on the GitHub-hosted large runner. The new run cancels the stuck one.
# The workflow has built-in logic to prevent failed builds from being deployed to production.
# Semantic versioning is used to determine the version number of the release. The project follows the Angular commit message convention. Depending on the commit message, the version number is incremented accordingly.
# You can manually trigger the workflow to trigger on-demand push to production.

name: Release to Production


on:
  schedule:
    - cron: '0 20 * * 1-5'  # At 12:00 PM PST (8 PM UTC), Monday through Friday
    - cron: '0 5 * * 2-6'  # At 9:00 PM PST (5 AM UTC next day), Monday through Friday
    - cron: '0 20 * * 6' # At 12:00 PM PST (8 PM UTC next day), Saturday - Due to Security Buletin Publication
    - cron: '0 20 * * 0' # At 12:00 PM PST (8 PM UTC next day),  Sunday - Due to Security Buletin Publication
  workflow_dispatch:
    inputs:
      useGitHubHostedLargeRunner:
        description: 'Use the GitHub-hosted large runner. Allowed values are true or false. Caution - this results in additional charges to the organization.'
        required: false
        default: 'false'
      securityAdvisoryPublished:
        description: 'Indicates if a security advisory has been published. Set to true to post a notification to Slack with a link to the security advisory page in the documentation. '
        required: false
        default: 'false'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_KEY }}
  AWS_REGION: us-west-2
  AWS_DEFAULT_REGION: us-west-2
  APPZI_TOKEN: ${{ secrets.APPZI_TOKEN }}
  FULLSTORY_ORGID: ${{ secrets.FULLSTORY_ORGID }}
  ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
  ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
  ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
  ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
  PALETTE_API_KEY: ${{ secrets.PALETTE_API_KEY }}
  DISABLE_PACKS_INTEGRATIONS: ${{ secrets.DISABLE_PACKS_INTEGRATIONS }}
  DISABLE_SECURITY_INTEGRATIONS: ${{ secrets.DISABLE_SECURITY_INTEGRATIONS }}
  SHOW_LAST_UPDATE_TIME: ${{ secrets.SHOW_LAST_UPDATE_TIME }}
  DSO_AUTH_TOKEN: ${{ secrets.DSO_AUTH_TOKEN }}
  SEERS_CMP_KEY: ${{ secrets.SEERS_CMP_KEY }}
  NODE_VERSION: "24"


concurrency:
  group: production-${{ github.workflow }}
  cancel-in-progress: true  

# Least-privilege GITHUB_TOKEN. Jobs that need more declare their own permissions.
permissions:
  contents: read

jobs:
# This is the default workflow that uses the self-hosted runner. The self-hosted runner is slower than the GitHub-hosted large runner, but it does not incurr additional charges.
  build-self-hosted-runner:
    if: ${{ github.event.inputs.useGitHubHostedLargeRunner != 'true' || github.event_name == 'schedule' }}
    name: Build Website (Self-Hosted Runner)
    runs-on: ["self-hosted", "linux", "x64", "vcenter3"]
    permissions:
      contents: read
      actions: read # The cached-build fallback lists and downloads artifacts from earlier runs.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: "master"


      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: |
          echo "CURRENT_STEP=npm ci" >> $GITHUB_ENV
          npm ci

      - name: Build
        run: |
          echo "CURRENT_STEP=Build" >> $GITHUB_ENV
          touch .env
          make build-ci

      - name: Build with cached packs
        id: cached_packs
        if: ${{ env.BUILD_EXIT_CODE == '5' }}
        uses: ./.github/actions/build-cached-packs
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with cached CVEs
        id: cached_cves
        if: ${{ env.BUILD_EXIT_CODE == '7' }}
        uses: ./.github/actions/build-cached-cves
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          slack-webhook: ${{ secrets.SLACK_PRIVATE_SECURITY_WEBHOOK }}

      - name: Upload to AWS
        if: ${{ env.BUILD_EXIT_CODE == '0' || steps.cached_packs.outputs['build-exit-code'] == '0' || steps.cached_cves.outputs['build-exit-code'] == '0' }}
        run: |
          echo "CURRENT_STEP=Upload to AWS" >> $GITHUB_ENV
          aws s3 sync --cache-control 'public, max-age=604800' --exclude '*.html' --exclude '*.xml' --exclude build/scripts/ build/ s3://docs.spectrocloud.com --delete
          aws s3 sync --cache-control 'public, max-age=0, s-maxage=604800' build/ s3://docs.spectrocloud.com --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_ID }} --paths "/*"

      - name: Slack Notification on Failure
        if: ${{ failure() || (env.BUILD_EXIT_CODE != '0' && steps.cached_packs.outputs['build-exit-code'] != '0' && steps.cached_cves.outputs['build-exit-code'] != '0') }}
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_PRIVATE_TEAM_WEBHOOK }}
          SLACK_USERNAME: "spectromate"
          SLACK_ICON_EMOJI: ":robot_panic:"
          SLACK_COLOR: "danger"
          SLACKIFY_MARKDOWN: true
          ENABLE_ESCAPES: true
          SLACK_MESSAGE: "The self-hosted runner release job for `${{ github.workflow }}` in `${{ github.repository }}` failed at step: `${{ env.CURRENT_STEP }}`. [View details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."


# Watches the self-hosted build. When the self-hosted runner is offline, the build job waits in the queue with no error until the next run cancels it.
# If no runner picks up the build within PICKUP_TIMEOUT_MINUTES, this job posts to Slack and dispatches this workflow again on the GitHub-hosted large runner. The Slack post keeps the outage visible.
# The dispatched run is in the same concurrency group, so it cancels this run, including the queued self-hosted job. A healthy runner picks up the build in a few seconds, so this job usually exits early.
  self-hosted-runner-watchdog:
    if: ${{ github.event.inputs.useGitHubHostedLargeRunner != 'true' || github.event_name == 'schedule' }} # Same condition as build-self-hosted-runner.
    name: Watch for the Self-Hosted Runner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write # Reads this run's jobs and dispatches the large-runner fallback.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SELF_HOSTED_JOB_NAME: "Build Website (Self-Hosted Runner)" # Must match the name of build-self-hosted-runner.
      PICKUP_TIMEOUT_MINUTES: "10"
      POLL_INTERVAL_SECONDS: "15"
    steps:
      - name: Wait for the Self-Hosted Runner
        id: wait
        run: |
          echo "CURRENT_STEP=Wait for the Self-Hosted Runner" >> "$GITHUB_ENV"
          deadline=$(( $(date +%s) + PICKUP_TIMEOUT_MINUTES * 60 ))
          last_status=""
          while :; do
            # Prints the job's status and runner name. A queued job has no runner yet.
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
              --jq '.jobs[] | select(.name == env.SELF_HOSTED_JOB_NAME) | [.status, (.runner_name // "")] | @tsv' || true)
            IFS=$'\t' read -r status runner <<< "$state" || true
            if [ -n "$status" ]; then last_status="$status"; fi
            if [ -n "$runner" ] || [ "$status" = "completed" ]; then
              echo "The self-hosted build was picked up (status: ${status}, runner: ${runner:-none})."
              echo "fallback=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              # Fall back only for a job the API reported. A renamed job or an API outage must not cancel a healthy build.
              if [ -z "$last_status" ]; then
                echo "::error::The jobs API never returned '${SELF_HOSTED_JOB_NAME}', so the watchdog did not fall back. Check that SELF_HOSTED_JOB_NAME matches the build job's name."
                exit 1
              fi
              echo "::warning::No runner picked up '${SELF_HOSTED_JOB_NAME}' within ${PICKUP_TIMEOUT_MINUTES} minutes (status: ${last_status}). Falling back to the GitHub-hosted large runner."
              echo "fallback=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for a runner (status: ${status:-not found})."
            sleep "$POLL_INTERVAL_SECONDS"
          done

      # Post before dispatching. The dispatched run cancels this run, which would stop any later step.
      - name: Post the Fallback to Slack
        if: ${{ steps.wait.outputs.fallback == 'true' }}
        continue-on-error: true # A Slack outage must not block the fallback build.
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_PRIVATE_TEAM_WEBHOOK }}
          SLACK_USERNAME: "spectromate"
          SLACK_ICON_EMOJI: ":robot_panic:"
          SLACK_COLOR: "warning"
          SLACKIFY_MARKDOWN: true
          ENABLE_ESCAPES: true
          SLACK_MESSAGE: "The self-hosted runner did not pick up `${{ github.workflow }}` in `${{ github.repository }}` within ${{ env.PICKUP_TIMEOUT_MINUTES }} minutes. This release falls back to the GitHub-hosted large runner, which costs extra. Check the `docs-runner` status in [the runner settings](${{ github.server_url }}/${{ github.repository }}/settings/actions/runners). [View the stuck run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

      - name: Dispatch the Large-Runner Build
        if: ${{ steps.wait.outputs.fallback == 'true' }}
        env:
          SECURITY_ADVISORY_PUBLISHED: ${{ github.event.inputs.securityAdvisoryPublished || 'false' }}
        run: |
          echo "CURRENT_STEP=Dispatch the Large-Runner Build" >> "$GITHUB_ENV"
          gh workflow run release.yaml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f useGitHubHostedLargeRunner=true \
            -f securityAdvisoryPublished="$SECURITY_ADVISORY_PUBLISHED"

      - name: Slack Notification on Failure
        if: ${{ failure() }}
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_PRIVATE_TEAM_WEBHOOK }}
          SLACK_USERNAME: "spectromate"
          SLACK_ICON_EMOJI: ":robot_panic:"
          SLACK_COLOR: "danger"
          SLACKIFY_MARKDOWN: true
          ENABLE_ESCAPES: true
          SLACK_MESSAGE: "The self-hosted runner watchdog for `${{ github.workflow }}` in `${{ github.repository }}` failed at step: `${{ env.CURRENT_STEP }}`. If the self-hosted runner is down, [run the workflow manually](${{ github.server_url }}/${{ github.repository }}/actions/workflows/release.yaml) with `useGitHubHostedLargeRunner` set to `true`. [View details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."


#  Use this workflow if you want to use the GitHub-hosted large runner. Useful for scenarios when you need a change to deploy faster than the self-hosted runner can build it.
  build-large-runner:
    if: ${{ github.event.inputs.useGitHubHostedLargeRunner == 'true' && github.event_name != 'schedule' }}
    name: Build Website (GitHub-Hosted Large Runner)
    runs-on: 
      group: 'Doc Runners'
      labels: docbot
    permissions:
      contents: read
      actions: read # The cached-build fallback lists and downloads artifacts from earlier runs.
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: "master"


      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - run: |
          echo "CURRENT_STEP=npm ci" >> $GITHUB_ENV
          npm ci

      
      - name: Build
        run: |
          echo "CURRENT_STEP=Build" >> $GITHUB_ENV
          touch .env
          make build-ci
      
      - name: Build with cached packs
        id: cached_packs
        if: ${{ env.BUILD_EXIT_CODE == '5' }}
        uses: ./.github/actions/build-cached-packs
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build with cached CVEs
        id: cached_cves
        if: ${{ env.BUILD_EXIT_CODE == '7' }}
        uses: ./.github/actions/build-cached-cves
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          slack-webhook: ${{ secrets.SLACK_PRIVATE_SECURITY_WEBHOOK }}

      - name: Upload to AWS
        run: |
          echo "CURRENT_STEP=Upload to AWS" >> $GITHUB_ENV
          aws s3 sync --cache-control 'public, max-age=604800' --exclude '*.html' --exclude '*.xml' --exclude build/scripts/ build/ s3://docs.spectrocloud.com --delete
          aws s3 sync --cache-control 'public, max-age=0, s-maxage=604800' build/ s3://docs.spectrocloud.com --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_ID }} --paths "/*"

      - name: Slack Notification on Failure
        if: ${{ failure() }}
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_PRIVATE_TEAM_WEBHOOK }}
          SLACK_USERNAME: "spectromate"
          SLACK_ICON_EMOJI: ":robot_panic:"
          SLACK_COLOR: "danger"
          SLACKIFY_MARKDOWN: true
          ENABLE_ESCAPES: true
          SLACK_MESSAGE: "The large runner release job for `${{ github.workflow }}` in `${{ github.repository }}` failed at step: `${{ env.CURRENT_STEP }}`. [View details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
  
  post-security-advisory:
    name: "Post Security Advisory Notification"
    if: always() && (needs.build-large-runner.result == 'success' || needs.build-self-hosted-runner.result == 'success') && github.event_name == 'workflow_dispatch' && github.event.inputs.securityAdvisoryPublished == 'true'
    needs: [build-self-hosted-runner,build-large-runner]
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: "spectromate"
          SLACK_ICON_EMOJI: ":robot_panic:"
          SLACK_COLOR: "#1E90FF"
          SLACK_MESSAGE: |
            :information_source: A new security advisory has just been published!  Check out the *<https://docs.spectrocloud.com/security-bulletins/security-advisories|Security Advisories>* page for more details. Stay informed and stay secure! :shield:
            
      - name: Slack Notification on Failure
        if: ${{ failure() }}
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_PRIVATE_TEAM_WEBHOOK }}
          SLACK_USERNAME: "spectromate"
          SLACK_ICON_EMOJI: ":robot_panic:"
          SLACK_COLOR: "danger"
          SLACKIFY_MARKDOWN: true
          ENABLE_ESCAPES: true
          SLACK_MESSAGE: "The post-security-advisory job for `${{ github.workflow }}` in `${{ github.repository }}` failed at step: `${{ env.CURRENT_STEP }}`. [View details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."


  release:
    name: "Release"
    if: always() && (needs.build-large-runner.result == 'success' || needs.build-self-hosted-runner.result == 'success')
    needs: [build-self-hosted-runner,build-large-runner]
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release pushes the release tag over the checkout's persisted GITHUB_TOKEN credentials.
    steps:
      - id: checkout
        name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve Credentials
        id: import-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.prism.spectrocloud.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: /providers/github/organizations/spectrocloud/token?org_name=spectrocloud token | VAULT_GITHUB_TOKEN

      - name: Setup Nodejs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: |
          echo "CURRENT_STEP=Install dependencies" >> $GITHUB_ENV
          npm ci

      - name: "release"
        env:
          GITHUB_TOKEN: ${{ steps.import-secrets.outputs.VAULT_GITHUB_TOKEN }}
        run: |
          echo "CURRENT_STEP=release" >> $GITHUB_ENV
          npx semantic-release

      - name: Slack Notification on Failure
        if: ${{ failure() }}
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_PRIVATE_TEAM_WEBHOOK }}
          SLACK_USERNAME: "spectromate"
          SLACK_ICON_EMOJI: ":robot_panic:"
          SLACK_COLOR: "danger"
          SLACKIFY_MARKDOWN: true
          ENABLE_ESCAPES: true
          SLACK_MESSAGE: "The release job for `${{ github.workflow }}` in `${{ github.repository }}` failed at step: `${{ env.CURRENT_STEP }}`. [View details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

  post-release-processing:
    name: "Post Release Processing"
    needs: [release]
    if: ${{ always() && needs.release.result == 'success' }}
    permissions:
      contents: read
      actions: read # Must cover what post_release.yaml requests.
    uses: ./.github/workflows/post_release.yaml
    secrets: inherit

  # Screenshot Capture used to run here. It now triggers on push to master instead, so a
  # reference set exists for every commit rather than only for whichever commit happened to
  # be at master's tip when this scheduled release ran. Keeping the call as well would
  # capture the same commit twice on release days. See screenshot_capture.yaml and the
  # DOC-3103 addendum.

  algolia-crawler:
    name: "Algolia Crawler"
    needs: [release]
    if: ${{ always() && needs.release.result == 'success' }}
    uses: ./.github/workflows/aloglia_crawler.yaml
    secrets: inherit
