name: "Link Fix Agent"

# Fixes the broken external links from the weekly link report with a headless
# Claude Code agent, reviews the fix in a separate context, opens a PR, tests
# the deploy preview, and merges when every check agrees.
# .github/link-fix-agent/README.md explains the flow, the files, and the tests.
#
# A live run (weekly on master, or by manual dispatch) opens a PR. A pull
# request that changes the agent gets a dry run instead, which never pushes or
# opens a PR: the live case plus a replay of the docs before 516ac87b5 (Linus's
# Nov 2 fix), so the agent's patch can be compared with a human answer key.
#
# SECURITY: neither agent holds a GitHub token. The checkout keeps no
# credentials, and the Vault token stays in step outputs that only the checkout
# and GitHub steps read. Each agent gets an exact tool set; the fixer has no
# shell, and the reviewer's shell runs only Vale and read-only git. Fetched web
# pages are untrusted input, so deterministic checks, not prompts, decide.

on:
  schedule:
    - cron: "0 15 * * 1" # Mondays, an hour after the weekly URL checks
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/link-fix-agent.yaml"
      - ".github/link-fix-agent/**"

permissions:
  # Pushing, labeling, and merging use the Vault-issued org token, so the
  # default GITHUB_TOKEN needs no write scope.
  contents: read

concurrency:
  group: link-fix-agent-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  CLAUDE_CODE_VERSION: "2.1.311"
  MODEL: "claude-opus-5-5"
  REVIEW_MODEL: "claude-haiku-5-5"
  MAX_BUDGET_USD: "3"
  REVIEW_BUDGET_USD: "1"
  AGENT_DIR: .github/link-fix-agent
  # Exact tool sets. The fixer has no shell. The reviewer's Bash is limited by
  # the --allowedTools patterns in its step.
  AGENT_TOOLS: "Edit,Glob,Grep,Read,Skill,WebFetch,WebSearch,Write"
  REVIEW_TOOLS: "Bash,Glob,Grep,Read,Skill"
  # Pinned docs-ai-context commit (private repo) for the pr-review-buddy and
  # style-guide skills.
  DOCS_AI_CONTEXT_REF: "56ad3a796e146f87120687a2ff78e5ae4e0e52eb" # main, 2026-11-04
  # The same Vale release as spellcheck-report.yaml.
  VALE_VERSION: "v3.24.0"
  # The oldest supported version branch, from the PR template.
  OLDEST_BACKPORT: version-4-7
  PR_BRANCH: bot/fix-broken-links
  # npm ci installs the husky hooks, and the pre-commit hook fails in CI on the
  # missing algolia.appId.
  HUSKY: "0"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nodejs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run the unit tests
        run: node --test "$AGENT_DIR/test/*.test.mjs"

  fix-links:
    name: Fix broken links (${{ matrix.case }})
    needs: test
    # Pull request runs need the repo secrets, so only branches in this
    # repository get them.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # About 10 minutes of agent work, plus 15 to 30 minutes of CI and Netlify.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(github.event_name == 'pull_request' && '["live","replay-nov02"]' || '["live"]') }}
    env:
      # Only a live run on master opens a PR.
      DRY_RUN: ${{ github.ref != 'refs/heads/master' || matrix.case != 'live' }}
      DOCS_REF: ${{ matrix.case == 'replay-nov02' && '516ac87b5e6c46634519291b6237175e6987b15a' || '' }}

    steps:
      # Setup

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nodejs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # linkinator comes from package-lock.json, the same version the weekly
      # report uses. The diff check imports it as a library.
      - name: Install Dependencies
        run: npm ci

      - name: Retrieve org GitHub token
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault.prism.spectrocloud.com
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          # Keep the token in this step's outputs, out of the agents' environment.
          exportEnv: false
          secrets: /providers/github/organizations/spectrocloud/token?org_name=spectrocloud token | VAULT_GITHUB_TOKEN

      - name: Checkout docs-ai-context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spectrocloud/docs-ai-context
          ref: ${{ env.DOCS_AI_CONTEXT_REF }}
          path: .docs-ai-context
          token: ${{ steps.vault.outputs.VAULT_GITHUB_TOKEN }}
          persist-credentials: false

      - name: Prepare workspace
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/link-fix"
          mkdir -p "$WORK/out" "$WORK/review"
          {
            echo "WORK=$WORK"
            echo "SESSION_ID=$(cat /proc/sys/kernel/random/uuid)"
            echo "PR_TITLE=docs: fix broken external links ($(date -u +'%b %-d') report)"
          } >> "$GITHUB_ENV"

          # Move docs-ai-context out of the working tree, so it never shows up
          # in the diff.
          mv .docs-ai-context "$WORK/docs-ai-context"

          # Replay: swap in the docs as they were before the human fix, and
          # commit them locally so the diff check compares against that tree.
          # Production carries the human fix, so it stands in for the deploy
          # preview, and no CI runs.
          if [[ -n "$DOCS_REF" ]]; then
            git fetch --quiet --depth=2 origin "$DOCS_REF"
            git rm -rq docs _partials linkinator
            git checkout "${DOCS_REF}^" -- docs _partials linkinator
            git -c user.name=link-fix-agent -c user.email=link-fix-agent@local \
              commit -qm "replay baseline ${DOCS_REF}^"
            echo "PREVIEW_BASE=https://docs.spectrocloud.com" >> "$GITHUB_ENV"
            echo "Dry run: no PR, so no CI checks ran." > "$WORK/out/pr-checks.txt"
          fi

          # .claude/ is gitignored, so the skills never show up in the diff.
          mkdir -p .claude/skills
          cp -R "$AGENT_DIR/fix-broken-links" .claude/skills/
          cp -R "$WORK/docs-ai-context/.claude/skills/pr-review-buddy" \
            "$WORK/docs-ai-context/.claude/skills/style-guide" .claude/skills/

      - name: Build the broken-link report
        id: report
        run: |
          set -euo pipefail
          # Same file list, config, and filter as `make verify-url-links-ci`.
          find ./docs ./_partials \( -name "*.md" -o -name "*.mdx" \) \
            | sed 's|^\./||' \
            | sed '/security-bulletins/d;/cve-reports/d;/oss-licenses/d;/deprecated/d' > "$WORK/paths.txt"
          # shellcheck disable=SC2046 # one argument per path, as in the Makefile
          npx linkinator $(cat "$WORK/paths.txt") \
            --config ./linkinator/linkinator-ci.config.json > "$WORK/raw.json" || true
          jq -e 'has("links")' "$WORK/raw.json" > /dev/null || { echo "linkinator produced no usable report"; exit 1; }
          jq '[.links[] | select(.url | test("^https?://")) | select(.status >= 400)]' "$WORK/raw.json" > "$WORK/link_report.json"
          rm "$WORK/raw.json"
          count=$(jq length "$WORK/link_report.json")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Broken external links: $count"
          jq -r '.[] | "\(.status) \(.url) <- \(.parent)"' "$WORK/link_report.json"

      # Fix

      - name: Install Claude Code
        if: ${{ steps.report.outputs.count != '0' }}
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Run the fixer agent
        if: ${{ steps.report.outputs.count != '0' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          set -euo pipefail
          # Not --bare: bare mode drops Write, WebSearch, and WebFetch, and the
          # agent then guesses URLs from memory. The session persists, so the
          # agent can address the review and test the preview later.
          claude -p "/fix-broken-links $WORK/link_report.json $WORK/out/fix-report.md" \
            --model "$MODEL" \
            --session-id "$SESSION_ID" \
            --setting-sources project \
            --strict-mcp-config \
            --tools "$AGENT_TOOLS" \
            --allowedTools Read Grep Glob Edit Write WebFetch WebSearch \
            --disallowedTools Bash \
            --add-dir "$WORK" \
            --max-budget-usd "$MAX_BUDGET_USD" \
            --output-format stream-json \
            --verbose \
            > "$WORK/out/run.jsonl"
          tail -n 1 "$WORK/out/run.jsonl" > "$WORK/out/run.json"
          node "$AGENT_DIR/agent-run.mjs" "$WORK/out/run.jsonl" --tools "$AGENT_TOOLS"

      # The first check only informs the fixer's second pass. The final check
      # after it decides.
      - name: Check the fixer's first diff
        id: first-check
        if: ${{ steps.report.outputs.count != '0' }}
        run: |
          node "$AGENT_DIR/check-link-fix-diff.mjs" . "$WORK/link_report.json" | tee "$WORK/out/diff-check-1.txt" || true
          if [[ -n "$(git status --porcelain)" ]]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # Review

      - name: Install Vale
        if: ${{ steps.first-check.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/vale-cli/vale/releases/download/${VALE_VERSION}/vale_${VALE_VERSION#v}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale --version
          vale sync

      - name: Gather the review inputs
        if: ${{ steps.first-check.outputs.changed == 'true' }}
        run: node "$AGENT_DIR/gather-review.mjs" "$WORK/review" "$PR_TITLE"

      - name: Run the reviewer agent
        if: ${{ steps.first-check.outputs.changed == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          set -euo pipefail
          # A fresh session on a smaller model, as the PR template asks.
          claude -p "/pr-review-buddy $WORK/review" \
            --model "$REVIEW_MODEL" \
            --setting-sources project \
            --strict-mcp-config \
            --tools "$REVIEW_TOOLS" \
            --allowedTools Read Grep Glob "Bash(vale *)" "Bash(printf *)" \
              "Bash(git show *)" "Bash(git grep *)" "Bash(git log *)" "Bash(git diff *)" \
            --append-system-prompt-file "$AGENT_DIR/prompts/review-in-ci.md" \
            --add-dir "$WORK/review" \
            --max-budget-usd "$REVIEW_BUDGET_USD" \
            --output-format stream-json \
            --verbose \
            --no-session-persistence \
            > "$WORK/out/review-run.jsonl"
          tail -n 1 "$WORK/out/review-run.jsonl" > "$WORK/out/review-run.json"
          node "$AGENT_DIR/agent-run.mjs" "$WORK/out/review-run.jsonl" \
            --tools "$REVIEW_TOOLS" --result-to "$WORK/review/review.md"

      - name: Address the review
        if: ${{ steps.first-check.outputs.changed == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          set -euo pipefail
          export REVIEW_FILE="$WORK/review/review.md" CHECK_FILE="$WORK/out/diff-check-1.txt" FIX_REPORT="$WORK/out/fix-report.md"
          # shellcheck disable=SC2016 # envsubst takes the variable names literally
          prompt=$(envsubst '$REVIEW_FILE $CHECK_FILE $FIX_REPORT' < "$AGENT_DIR/prompts/address-review.md")
          claude -p "$prompt" \
            --resume "$SESSION_ID" \
            --model "$MODEL" \
            --setting-sources project \
            --strict-mcp-config \
            --tools "$AGENT_TOOLS" \
            --allowedTools Read Grep Glob Edit Write WebFetch WebSearch \
            --disallowedTools Bash \
            --add-dir "$WORK" \
            --max-budget-usd "$MAX_BUDGET_USD" \
            --json-schema "$(cat "$AGENT_DIR/prompts/decision.schema.json")" \
            --output-format json \
            > "$WORK/out/address-run.json"
          node "$AGENT_DIR/agent-run.mjs" "$WORK/out/address-run.json" --decision-to "$WORK/out/decision.json"

      - name: Check the final diff
        id: check
        if: ${{ steps.first-check.outputs.changed == 'true' }}
        run: |
          set +e
          node "$AGENT_DIR/check-link-fix-diff.mjs" . "$WORK/link_report.json" | tee "$WORK/out/diff-check.txt"
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          if [[ -n "$(git status --porcelain)" ]]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          git diff > "$WORK/out/fix.patch"
          git diff --stat

      # PR

      - name: Pick backport labels
        if: ${{ steps.check.outputs.exit == '0' && steps.check.outputs.changed == 'true' }}
        run: node "$AGENT_DIR/backport-labels.mjs" "$WORK/out/fix.patch" "$OLDEST_BACKPORT" "$WORK/out"

      - name: Write the PR description
        if: ${{ steps.check.outputs.exit == '0' && steps.check.outputs.changed == 'true' }}
        run: node "$AGENT_DIR/write-pr-text.mjs" "$WORK"

      - name: Open or update the PR
        id: pr
        if: ${{ env.DRY_RUN == 'false' && steps.check.outputs.exit == '0' && steps.check.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.vault.outputs.VAULT_GITHUB_TOKEN }}
        run: |
          node "$AGENT_DIR/open-pr.mjs" "$WORK"
          # The fix is committed now, so later diffs compare against master.
          echo "DIFF_BASE=HEAD~1" >> "$GITHUB_ENV"

      # Deploy preview and merge

      - name: Wait for CI and the deploy preview
        id: ci
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ steps.vault.outputs.VAULT_GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: node "$AGENT_DIR/wait-for-ci.mjs" "$PR" "$WORK/out/pr-checks.txt"

      - name: Check the deploy preview
        id: preview
        if: ${{ env.PREVIEW_BASE != '' && steps.check.outputs.exit == '0' && steps.check.outputs.changed == 'true' }}
        run: |
          set +e
          node "$AGENT_DIR/check-preview.mjs" . "$PREVIEW_BASE" "$WORK/out/preview-check.json" "${DIFF_BASE:-HEAD}" \
            | tee "$WORK/out/preview-check.txt"
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Test the deploy preview
        if: ${{ steps.preview.outputs.exit != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          set -euo pipefail
          export PREVIEW_BASE PREVIEW_FILE="$WORK/out/preview-check.txt" CHECKS_FILE="$WORK/out/pr-checks.txt"
          # shellcheck disable=SC2016 # envsubst takes the variable names literally
          prompt=$(envsubst '$PREVIEW_BASE $PREVIEW_FILE $CHECKS_FILE' < "$AGENT_DIR/prompts/test-preview.md")
          # The PR is already pushed, so this pass can read and fetch, but not edit.
          claude -p "$prompt" \
            --resume "$SESSION_ID" \
            --model "$MODEL" \
            --setting-sources project \
            --strict-mcp-config \
            --tools "Glob,Grep,Read,WebFetch" \
            --allowedTools Read Grep Glob WebFetch \
            --add-dir "$WORK" \
            --max-budget-usd "$MAX_BUDGET_USD" \
            --json-schema "$(cat "$AGENT_DIR/prompts/decision.schema.json")" \
            --output-format json \
            > "$WORK/out/preview-run.json"
          node "$AGENT_DIR/agent-run.mjs" "$WORK/out/preview-run.json" --decision-to "$WORK/out/final-decision.json"

      - name: Merge or hand off
        if: ${{ always() && steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ steps.vault.outputs.VAULT_GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
          CI_OK: ${{ steps.ci.outputs.ok }}
          PREVIEW_EXIT: ${{ steps.preview.outputs.exit }}
        run: node "$AGENT_DIR/merge-or-hand-off.mjs" "$WORK" "$PR"

      # Reporting

      - name: Write the job summary
        if: ${{ always() && steps.report.outputs.count != '' }}
        env:
          CASE: ${{ matrix.case }}
          COUNT: ${{ steps.report.outputs.count }}
          CHECK_EXIT: ${{ steps.check.outputs.exit }}
          PREVIEW_EXIT: ${{ steps.preview.outputs.exit }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: node "$AGENT_DIR/job-summary.mjs" "$WORK" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: link-fix-${{ matrix.case }}
          path: |
            ${{ env.WORK }}/link_report.json
            ${{ env.WORK }}/out/
            ${{ env.WORK }}/review/
          if-no-files-found: warn

      - name: Fail if the final diff check failed
        if: ${{ steps.check.outputs.exit != '' && steps.check.outputs.exit != '0' }}
        run: |
          echo "::error::The diff check rejected the agent's edits. See the job summary."
          exit 1

      - name: Failure Slack Notification
        if: ${{ failure() && env.DRY_RUN == 'false' }}
        uses: rtCamp/action-slack-notify@06cc13f74fa8d4d2296c09455d91e9453e4025f4 # v2.4.1
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_PRIVATE_TEAM_WEBHOOK }}
          SLACK_COLOR: ${{ job.status }}
          SLACKIFY_MARKDOWN: true
          ENABLE_ESCAPES: true
          SLACK_MESSAGE: 'The Link Fix Agent job in `${{ github.repository }}` failed. [View details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).'
