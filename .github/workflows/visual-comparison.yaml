# This workflow is triggered by the presence of the label 'visual-tests' on a PR.
# The workflow is designed to run visual tests using Playwright on the PR branch by comparing the screenshots with the reference screenshots taken from the default branch.
# The screenshots are compared using the uploaded artifacts generated by the screenshot_capture workflow.
# Upon completion, the workflow generates a visual comparison report that is hosted on GitHub Pages.
# A comment is posted on the PR with the URL to the visual comparison report.
# You can learn more about the visual comparison framework by visiting https://spectrocloud.atlassian.net/wiki/spaces/DE/pages/2184249350/Visual+Testing 


name: Visual Comparison


on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches-ignore: ["version-*", "docs-rel-*"]


env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PALETTE_API_KEY: ${{ secrets.PALETTE_API_KEY }}
  FULLSTORY_ORGID: ${{ secrets.FULLSTORY_ORGID }}
  ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
  ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
  ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
  ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
  HTML_REPORT_URL_PATH: reports/${{ github.head_ref }}/${{ github.run_id }}/${{ github.run_attempt }}
  DISABLE_PACKS_INTEGRATIONS: ${{ secrets.DISABLE_PACKS_INTEGRATIONS }}
  DISABLE_SECURITY_INTEGRATIONS: ${{ secrets.DISABLE_SECURITY_INTEGRATIONS }}
  SHOW_LAST_UPDATE_TIME: ${{ secrets.SHOW_LAST_UPDATE_TIME }}
  DSO_AUTH_TOKEN: ${{ secrets.DSO_AUTH_TOKEN }}
  SEERS_CMP_KEY: ${{ secrets.SEERS_CMP_KEY }}
  NODE_VERSION: "24"


concurrency:
  group: "visual-comparison-${{ github.workflow }}-${{ github.head_ref }}"
  cancel-in-progress: true

# Least privilege by default; jobs that need more override this individually below.
permissions:
  contents: read


jobs:
  run-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    # NOTE: github.actor is intentional here. Do not "harden" this to
    # github.event.pull_request.user.login. Runs triggered BY Dependabot get a read-only
    # token and no repository secrets, so the build cannot succeed. When a maintainer
    # applies the visual-tests label, github.actor is that maintainer and the run does
    # get secrets. The PR author is always dependabot[bot], so gating on it blocks the
    # human-triggered case permanently. See DOC-3101.
    if: >-
      ${{ !github.event.pull_request.draft
          && github.actor != 'dependabot[bot]'
          && github.actor != 'dependabot-preview[bot]'
          && contains(github.event.pull_request.labels.*.name, 'visual-tests') }}
    steps:
      # If the condition above is not met, aka, the PR is not in draft status, then this step is skipped.
      # Because this step is part of the critical path, omission of this step will result in remaining CI steps not gettinge executed.
      # As of 8/8/2022, there is no way to enforce this behavior in GitHub Actions CI.
      - name: Log refs
        # Security: pass GitHub context values through env so branch names are logged as data, not shell source text.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          HTML_REPORT_URL_PATH_VALUE: ${{ env.HTML_REPORT_URL_PATH }}
        run: |
          printf 'GITHUB_BASE_REF: %s\n' "$BASE_REF"
          printf 'GITHUB_HEAD_REF: %s\n' "$HEAD_REF"
          printf 'GITHUB_REF_NAME: %s\n' "$REF_NAME"
          printf 'HTML_REPORT_URL_PATH %s\n' "$HTML_REPORT_URL_PATH_VALUE"
          exit 0



  create-assets:
    name: create-assets
    needs: [run-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Posts the "starting the visual tests" comment on the PR.
    # `actions: read` is required: build-cached-packs and build-cached-cves resolve and
    # download artifacts from earlier workflow runs via the Actions API, which the default
    # `contents: read` token cannot reach.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    # The base commit this job's build was actually produced from. take-screenshots consumes
    # the build artifact this job uploads, so this job's checkout is the authority on what the
    # reference set has to match.
    outputs:
      base-sha: ${{ steps.base_commit.outputs.sha }}
    steps:
      - name: Checkout Repository
        # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Needed for the base-commit resolution below: at the default depth of 1 the merge
          # commit is shallow-grafted, which hides its parents and makes HEAD^1 unresolvable.
          #
          # 2 is the whole requirement, and it must not be widened to 0 as a convenience.
          # fetch-depth: 0 fetches every ref, and this repository is roughly 9 GB on GitHub,
          # about 80% of which is 40k Playwright PNGs under reports/ on gh-pages. That clone
          # is fatal in CI. See DOC-3101, where the same suggestion was raised and rejected.
          fetch-depth: 2

      # On `pull_request`, actions/checkout leaves HEAD at refs/pull/N/merge: this PR's head
      # merged into the base branch as of checkout time. Its first parent is therefore the
      # exact base commit this build is produced from, which is what a reference set has to
      # match to make the visual diff attributable.
      #
      # Do not substitute github.event.pull_request.base.sha here. That value is snapshotted
      # into the webhook payload when the triggering event fired, while GitHub recomputes the
      # merge ref whenever master moves. The two drift on a re-run, on a queued run, and on
      # any merge landing in the half hour before this checkout. When they drift and a set
      # happens to exist for the stale payload value, the lookup reports EXACT and claims the
      # diff is attributable, against a commit the build never contained. That is the exact
      # failure this work set out to remove, so it must not be reintroduced as a false
      # positive. See DOC-3103 addendum.
      - name: Resolve Base Commit
        id: base_commit
        env:
          PAYLOAD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if BASE_SHA=$(git rev-parse --verify --quiet "HEAD^1"); then
            echo "Base commit resolved from the merge ref: $BASE_SHA"
          else
            BASE_SHA="$PAYLOAD_BASE_SHA"
            echo "HEAD is not a merge commit. Falling back to the event payload: $BASE_SHA"
            echo "This value can be stale; treat an EXACT match below with suspicion."
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js Environment
        # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6 as of May 6, 2026
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # Preflight before anything expensive. Without this, an unavailable reference set is
      # only discovered inside take-screenshots, after all four shards have each run a
      # checkout, npm ci, Playwright install and build download, and it then surfaces as four
      # identical failures plus two skipped jobs. Failing here costs one job and names the
      # cause. See DOC-3103.
      - name: Verify Reference Screenshots Are Available
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Asking for the base commit's reference set means the diff shows only what this PR
          # changed, rather than also showing whatever landed on master since the last
          # capture. Falls back to the newest set if none exists. See Resolve Base Commit.
          BASE_SHA: ${{ steps.base_commit.outputs.sha }}
        run: ./scripts/screenshot_artifacts.sh --check-only --match-sha "$BASE_SHA"

      - name: Post PR Comment
        # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9 as of May 10, 2026
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🤖 Starting the visual tests. This will take approximately an hour.`,
            });

      - name: Install Dependencies
        # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0 as of May 6, 2026
        with: 
            command: npm ci
            attempt_limit: 3
            attempt_delay: 60000 # 1 minute

      - name: Build
        run: |
          touch .env
          make build-ci
      
      - name: Build with cached packs
        id: cached_packs
        if: ${{ env.BUILD_EXIT_CODE == '5' }}
        uses: ./.github/actions/build-cached-packs
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with cached CVEs
        id: cached_cves
        if: ${{ env.BUILD_EXIT_CODE == '7' }}
        uses: ./.github/actions/build-cached-cves
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "build"
          path: |
            build/
          if-no-files-found: error
          retention-days: 1



  take-screenshots:
    name: Visual Comparison
    needs: [run-ci, create-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `actions: read` is required: scripts/screenshot_artifacts.sh lists the repository's
    # artifacts through the Actions API to find the newest unexpired reference screenshots.
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Check out repository code
        # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js environment
        # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6 as of May 6, 2026
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Dependencies
        # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0 as of May 6, 2026
        with: 
            command: npm ci
            attempt_limit: 3
            attempt_delay: 60000 # 1 minute

      # Split the apt step (--with-deps) from the browser download so a failure is attributable
      # in the logs. A healthy install takes ~15s.
      #
      # The apt step is the observed flake. Each of the four shards races independently, which is
      # why the failure lands on a different shard each time.
      #
      # `timeout` bounds each attempt, and the `pkill` after it is NOT optional. Without it,
      # `timeout` kills node but leaves the apt-get it spawned running as an orphan still holding
      # the dpkg lock, so every remaining retry fails in ~2s against our own process:
      #   E: Could not get lock /var/lib/dpkg/lock-frontend. It is held by process NNNN (apt-get)
      # Runs 32252072288 and 32263311838 died exactly that way, with the orphan's own download
      # output still arriving in the log after the final attempt had already failed.
      #
      # The underlying slowness is mirror throughput, not a stall, and it varies per runner: on
      # 2026-08-19 run 32275446920 pulled the same 21 MB of font packages in 338s on shard 1 while
      # shards 2 to 4 could not finish inside 20 minutes.
      #
      # Retries are productive rather than decorative: apt keeps completed and partial .debs in
      # /var/cache/apt/archives, so attempt 2 resumes where attempt 1 was cut off. Budget is
      # 3 x 360s plus 2 x 60s of delay = 20 min, inside the 25 min step ceiling.
      #
      # DPkg::Lock::Timeout makes apt wait for a genuinely contended lock instead of exiting 100.
      # Playwright shells out to apt-get internally, so a config file is the only way to set it.
      #
      # None of this fixes a collapsed mirror. The durable fix is the mcr.microsoft.com/playwright
      # image, which ships these fonts pre-baked and removes apt, the mirror, the lock and this
      # whole scaffolding. See DOC-3103.
      - name: Install Playwright system dependencies
        timeout-minutes: 25
        # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0 as of May 6, 2026
        with:
          command: |
            echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99lock-timeout >/dev/null
            sudo systemctl stop unattended-upgrades apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
            if ! timeout 360 npx playwright install-deps chromium; then
              sudo pkill -TERM -x apt-get 2>/dev/null || true
              sleep 5
              sudo pkill -KILL -x apt-get 2>/dev/null || true
              exit 1
            fi
          attempt_limit: 3
          attempt_delay: 60000 # 1 minute

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Download Build
        # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0 as of May 6, 2026
        with: 
          attempt_limit: 3
          # Security: pin nested third-party action refs as well; wretry will call this exact commit.
          action: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8 as of May 6, 2026
          with: |
            name: build
            path: build
          attempt_delay: 60000 # 1 minute

      - name: Download Reference Screenshots
        env:
          # Resolved once in create-assets, from the merge ref that produced the build these
          # shards download. Deliberately not github.event.pull_request.base.sha, which can
          # be stale by the time this runs. See create-assets' Resolve Base Commit step.
          BASE_SHA: ${{ needs.create-assets.outputs.base-sha }}
        run: ./scripts/screenshot_artifacts.sh --match-sha "$BASE_SHA" ./screenshots

      - name: Take screenshots with Playwright
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} || exit 0

      - name: Upload blob report to GitHub Actions Artifacts
        # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 as of May 6, 2026
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1


  merge-reports:
    name: Merge Reports
    needs: [take-screenshots]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - name: Check out repository code
      # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node.js environment
      # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6 as of May 6, 2026
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: "npm"

    - name: Install Dependencies
      # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
      uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0 as of May 6, 2026
      with: 
          command: npm ci
          attempt_limit: 3
          attempt_delay: 60000 # 1 minute
    
    - name: Download blob reports from GitHub Actions Artifacts
      # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8 as of May 6, 2026
      with:
        path: all-blob-reports
        pattern: blob-report-*
        merge-multiple: true

    - name: Merge into HTML Report
      run: npx playwright merge-reports --reporter html ./all-blob-reports

    - name: Upload Report
      # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 as of May 6, 2026
      id: report
      with:
        name: "report"
        path: |
          playwright-report/
        if-no-files-found: error
        retention-days: 1  


  head_ref_check:
    name: Confirm Head Branch Still Exists
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # DOC-3108 Option B — a `labeled` event on a closed PR whose branch has already
    # been deleted still fires this workflow. If the publish step below runs after that,
    # it writes `reports/<sanitised-head-ref>` under a name that `clean-up-report.yaml`
    # can never prune (the delete event has already happened), and posts a live report
    # URL comment on the closed PR that stays reachable for the report's retention
    # period. Query the remote for the branch here and gate `publish_report` on the
    # result so the orphan is never created in the first place. The scheduled sweep in
    # `reconcile-orphan-reports.yaml` still covers pre-DOC-3108 orphans and the narrow
    # window where the branch disappears between this check and the push.
    permissions:
      contents: read
    outputs:
      branch_present: ${{ steps.check.outputs.branch_present }}
    steps:
      - name: Check that head branch still exists on origin
        id: check
        # Security: pass untrusted branch names through env, not through shell
        # interpolation. `git ls-remote` needs no checkout, so this is a cheap probe.
        env:
          HEAD_REF: ${{ github.head_ref }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        # The sentinels below are deliberately `present`/`absent` and NOT `true`/`false`.
        # Several secrets in this workflow's top-level `env:` block hold the literal
        # string `true` or `false` (DISABLE_PACKS_INTEGRATIONS, DISABLE_SECURITY_INTEGRATIONS,
        # SHOW_LAST_UPDATE_TIME). Actions registers every secret value as a mask for the
        # whole job, then refuses to set any job output containing a masked value:
        #   ##[warning]Skip output 'branch_present' since it may contain secret.
        # The output then arrives at `publish_report` as an empty string, the `if` is
        # false, and the publish silently skips while the run stays green. That is
        # exactly what happened to every run between DOC-3108 merging and this fix.
        # Do not "tidy" these back to booleans. See DOC-3108.
        run: |
          set -euo pipefail

          if [ -z "$HEAD_REF" ]; then
            echo "::notice::Empty head_ref; skipping publish."
            printf 'branch_present=absent\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --heads "$REPO_URL" "refs/heads/$HEAD_REF" >/dev/null 2>&1; then
            printf 'branch_present=present\n' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Head branch '$HEAD_REF' no longer exists on origin; skipping publish to avoid orphaning reports/<sanitised>. The scheduled sweep in reconcile-orphan-reports.yaml will not have to fix this one."
            printf 'branch_present=absent\n' >> "$GITHUB_OUTPUT"
          fi


  publish_report:
    name: Publish HTML Report
    needs: [run-ci, take-screenshots, merge-reports, head_ref_check]
    # `present`/`absent` rather than `true`/`false` is load-bearing — see the sentinel
    # comment in head_ref_check's check step before changing this comparison.
    if: needs.head_ref_check.outputs.branch_present == 'present'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pushes the report to gh-pages and posts the report URL comment on the PR.
    permissions:
      contents: write
      pull-requests: write
    # NOTE: a failed push still leaves the overall run green. Check this job's own
    # status when verifying that a report actually published. See DOC-3101.
    continue-on-error: true
    steps: 

    - name: Checkout GitHub Pages Branch
      # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: gh-pages  

    - name: Set Git User
          # see: https://github.com/actions/checkout/issues/13#issuecomment-724415212
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Sanitize branch name for path
      # Security: pass untrusted branch names through env and write env values with printf.
      env:
        HEAD_REF: ${{ github.head_ref }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        BRANCH_SAFE=$(printf '%s' "$HEAD_REF" | sed 's/\//-/g')
        printf 'BRANCH_SAFE=%s\n' "$BRANCH_SAFE" >> "$GITHUB_ENV"
        printf 'HTML_REPORT_URL_PATH=reports/%s/%s/%s\n' "$BRANCH_SAFE" "$RUN_ID" "$RUN_ATTEMPT" >> "$GITHUB_ENV"

    - name: Download zipped HTML report
      # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8 as of May 6, 2026
      with:
        name: report
        path: ${{ env.HTML_REPORT_URL_PATH }}

    # Every run of this workflow adds reports/<branch>/<run-id>/<attempt> to gh-pages, and
    # clean-up-report.yaml only prunes on branch *deletion*. A long-lived branch that is
    # retriggered repeatedly therefore accumulates a full report per run: measured on
    # 2026-08-18, doc-3103-addendum alone held 8 run directories, 381 files and 0.23 GB,
    # which was 88% of everything on gh-pages.
    #
    # Keep the newest REPORTS_TO_KEEP runs for this branch and drop the rest. Run ids
    # increase monotonically, so a numeric sort on the directory name is newest-last.
    #
    # NOTE for reviewers: this makes report URLs in older PR comments 404 once a branch
    # exceeds the keep count. That is the intended trade, but it is user-visible. Raise
    # REPORTS_TO_KEEP if the team wants a deeper history.
    #
    # This reclaims checkout size only. The blobs remain in gh-pages history, so it slows
    # growth rather than shrinking the 9.4 GB clone; that needs gh-pages orphaned.
    - name: Prune Old Reports for This Branch
      # Never fail the publish over housekeeping; the new report is what matters.
      continue-on-error: true
      env:
        REPORTS_TO_KEEP: "5"
      run: |
        set -euo pipefail

        branch_dir="reports/${BRANCH_SAFE}"
        if [ ! -d "$branch_dir" ]; then
          echo "No existing reports for ${BRANCH_SAFE}; nothing to prune."
          exit 0
        fi

        # Exclude the run just downloaded so a fresh report is never a prune candidate.
        mapfile -t stale < <(
          find "$branch_dir" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | grep -E '^[0-9]+$' \
            | grep -v -x "${GITHUB_RUN_ID}" \
            | sort -n \
            | head -n -"${REPORTS_TO_KEEP}"
        ) || true

        if [ "${#stale[@]}" -eq 0 ]; then
          echo "Fewer than ${REPORTS_TO_KEEP} prior runs for ${BRANCH_SAFE}; nothing to prune."
          exit 0
        fi

        for run in "${stale[@]}"; do
          echo "Pruning ${branch_dir}/${run}"
          git rm -r --quiet "${branch_dir}/${run}"
        done

        echo "Pruned ${#stale[@]} report(s), keeping the newest ${REPORTS_TO_KEEP} plus this run."

    - name: Push HTML Report
      timeout-minutes: 5
      run: |
        git add .
        git commit -m "workflow: add HTML report for run-id ${{ github.run_id }} (attempt:  ${{ github.run_attempt }})"

        # Retry to survive a concurrent push to gh-pages from another visual test run.
        # The retry is bounded and tests each command directly: the default shell is
        # `bash -e`, so an unguarded failure would abort the step before any `$?` check
        # could run, and an unbounded `while true` would spin against the remote.
        for attempt in 1 2 3 4 5; do
          if ! git pull --rebase; then
            echo "Failed to rebase. Please review manually."
            exit 1
          fi

          if git push; then
            echo "Successfully pushed HTML report to repo."
            exit 0
          fi

          echo "Push rejected (attempt ${attempt} of 5), retrying..."
          sleep 5
        done

        echo "Exhausted push retries. Please review manually."
        exit 1


    - name: DNS Wait
      run:  sleep 120

        
    - name: GH Pages URL
      run: |
        echo "::notice title= Published Playwright Test Report::https://spectrocloud.github.io/librarium/$HTML_REPORT_URL_PATH"

    - name: Post Report URL Comment
      # Security: pin third-party actions to immutable commits; keep the original version in the comment for Dependabot/reviewers.
      uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9 as of May 10, 2026
      env:
        HEAD_REF: ${{ github.head_ref }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        HTML_REPORT_URL_PATH: ${{ env.HTML_REPORT_URL_PATH }}
      with:
        script: |
          const headRef = process.env.HEAD_REF;
          const runId = process.env.RUN_ID;
          const runAttempt = process.env.RUN_ATTEMPT;
          const reportPath = process.env.HTML_REPORT_URL_PATH;

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            body: `📋 Visual Report for branch ${headRef} with CI run ${runId} and attempt ${runAttempt} is ready at https://spectrocloud.github.io/librarium/${reportPath}

            💡 You may have to wait for DNS to resolve or the GitHub Pages job to complete. You can view the progress of the GitHub Pages job [here](https://github.com/spectrocloud/librarium/actions/workflows/pages/pages-build-deployment).`,
          });
