# This workflow is triggered when a branch is deleted. Tag deletions and the long-lived
# branches (master, main, gh-pages) are filtered out by the job conditions below. The
# `delete` event does not support branches-ignore, so that filtering has to happen in the
# job `if:` rather than in the `on:` block. See DOC-3101.
# The visual tests reports for the deleted branch are removed from the gh-pages branch. This is to ensure that the reports are not visible on the website after the branch is deleted and to reduce the size of the repository.
# The workflow also removes branches that may have been automatically added to Netlify's branch deploy list.
# It's common for release related branches to be added to the Netlify branch deploy list. Otherwise, if not part of the deploy list, the branch will not receive a Netlify deploy preview URL.

name: Delete Visual Tests Reports

on:
  delete:

env:
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
  GITHUB_BRANCH: ${{ github.event.ref }}

concurrency:
  group: clean-up-report-${{ github.event.ref }}
  cancel-in-progress: true

jobs:
  update_netlify:
    if: >-
      ${{ github.event.ref_type == 'branch'
          && !contains(fromJSON('["master", "main", "gh-pages"]'), github.event.ref) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The Netlify script lives under scripts/ on the default branch, not on gh-pages.
      # Do not add `ref: gh-pages` here or the script will not be present.
      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove Branch From Netlify
        run: cd scripts && ./netlify_remove_branch.sh

  delete_reports:
    name: Delete Reports
    if: >-
      ${{ github.event.ref_type == 'branch'
          && !contains(fromJSON('["master", "main", "gh-pages"]'), github.event.ref) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout GitHub Pages Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages

      - name: Set Git User
        # see: https://github.com/actions/checkout/issues/13#issuecomment-724415212
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sanitize branch name for path
        id: branch
        env:
          DELETED_REF: ${{ github.event.ref }}
        run: |
          BRANCH_SAFE=$(printf '%s\n' "${DELETED_REF}" | sed 's/\//-/g')
          printf 'branch-safe=%s\n' "$BRANCH_SAFE" >> "$GITHUB_OUTPUT"

      - name: Check for workflow reports
        id: reports
        env:
          BRANCH_SAFE: ${{ steps.branch.outputs.branch-safe }}
        run: |
          if [ -d "reports/${BRANCH_SAFE}" ]; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
          else
            echo "No reports directory for reports/${BRANCH_SAFE}; nothing to clean up."
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Delete reports from repo for branch
        if: ${{ steps.reports.outputs.exists == 'true' }}
        timeout-minutes: 3
        env:
          BRANCH_SAFE: ${{ steps.branch.outputs.branch-safe }}
          DELETED_REF: ${{ github.event.ref }}
        run: |
          rm -rf "reports/${BRANCH_SAFE}"
          git add .

          if git diff --staged --quiet; then
            echo "Nothing staged for reports/${BRANCH_SAFE}; nothing to commit."
            exit 0
          fi

          git commit -m "workflow: remove all reports for branch ${DELETED_REF}"

          # Retry to survive a concurrent push to gh-pages. The retry is bounded and
          # tests each command directly: the default shell is `bash -e`, so an
          # unguarded failure would abort the step before any `$?` check could run,
          # and an unbounded `while true` would spin against the remote.
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase; then
              echo "Failed to rebase. Please review manually."
              exit 1
            fi

            if git push; then
              echo "Successfully removed reports for branch ${DELETED_REF}."
              exit 0
            fi

            echo "Push rejected (attempt ${attempt} of 5), retrying..."
            sleep 5
          done

          echo "Exhausted push retries. Please review manually."
          exit 1
