StylesPath = vale/styles
Vocab = spectrocloud-vocab
MinAlertLevel = error

Packages = https://github.com/spectrocloud/spectro-vale-pkg/releases/latest/download/spectrocloud-docs-internal.zip
IgnoredScopes = code, tt, img, url, a 

[*.md]
# Skip MDX components such as <VersionedLink /> and <PartialsComponent />, and HTML tags with JSX expressions such as
# style={{ ... }}. Without this, Vale drops the tag and joins the words on either side of it, so
# "the <VersionedLink ... /> pack" is reported as "thepack".
TokenIgnores = (</?[A-Z][A-Za-z]*\b[^>]*>), (<[a-z][a-z0-9]*\s[^>]*=\{[^>]*>)
Vale.Spelling = YES

[formats]
mdx = md
